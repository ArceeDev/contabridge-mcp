[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contabridge-mcp"
version = "0.3.0"
description = "MCP server for Spanish accounting import files: convert journals between A3 (SUENLACE.DAT), ContaPlus, Sage 50, CSV, QuickBooks (IIF/CSV) and Xero (CSV), and turn Norma 43 bank statements into journal entries. Billed per call with KeyFlint credits."
readme = "README.md"
requires-python = ">=3.10"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "ArceeDev" }]
keywords = ["mcp", "contabilidad", "a3", "a3asesor", "suenlace", "contaplus", "sage", "libro-diario", "asientos", "norma43", "gestoria", "spain", "quickbooks", "iif", "xero"]
dependencies = [
    "mcp>=2.0",
    "keyflint-verify[fast]>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
contabridge-mcp = "contabridge_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ArceeDev/contabridge-mcp"
Source = "https://github.com/ArceeDev/contabridge-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
